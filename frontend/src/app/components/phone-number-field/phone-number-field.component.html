<ea-input
  id="phone-number-input"
  autocomplete="tel"
  label="Phone number"
  placeholder="555-123-1234"
  type="tel"
  [errorMessages]="errorMessages"
  [formControl]="control()"
  [labelHelp]="help"
  [maxLength]="20" />

<ng-template #help>
  <em>Optional.</em>
  Your phone number is only visible to club admins and will never be shared with third
  parties or used for marketing. It is only used to get in touch when we cannot reach you
  by email.
</ng-template>
