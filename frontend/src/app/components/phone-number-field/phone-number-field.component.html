<lcc-field-label-with-help
  text="Phone number"
  forId="phone-number-input"
  [helpTooltip]="tooltip" />
<ea-input
  id="phone-number-input"
  type="tel"
  autocomplete="tel"
  placeholder="555-123-1234"
  [maxLength]="20"
  [errorMessages]="errorMessages"
  [formControl]="control()" />

<ng-template #tooltip>
  <div>
    <em>Optional.</em>
    Your phone number is only visible to club admins and will never be shared with third
    parties or used for marketing. It is only used to get in touch when we cannot reach
    you by email.
  </div>
</ng-template>
