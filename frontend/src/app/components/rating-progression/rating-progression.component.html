@switch (status()) {
  @case ('failed') {
    <div class="rating-progression__message">
      <lcc-load-failed
        title="Unable to load rating progression"
        (retry)="onRetry()" />
    </div>
  }
  @case ('loading') {
    <ea-skeleton
      class="rating-progression__skeleton"
      variant="rect"
      width="100%"
      height="100%"
      aria-busy="true" />
  }
  @default {
    <ea-line-chart
      aria-label="Rating at each rated tournament, oldest first"
      animation="draw"
      curve="smooth"
      xLabelOrientation="auto"
      [animationDuration]="3000"
      [formatValue]="formatRating"
      [height]="chartHeight"
      [labels]="labels()"
      [maxYStep]="maxRatingStep"
      [series]="series()"
      [showAxisBreak]="true"
      [showLegend]="false"
      [visibleXSpan]="visibleSpan"
      [xTicks]="xTicks()"
      [xValues]="xValues()"
      [yMax]="yMax()"
      [yMin]="yMin()" />
  }
}
