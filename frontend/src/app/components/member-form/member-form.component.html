<ea-card [fullWidth]="true">
  <div class="lcc-form-card">
    <form
      class="lcc-form"
      [formGroup]="form"
      (focusout)="onFieldLeft()"
      (ngSubmit)="onSubmit()">
      <div class="lcc-form-fields">
        <label
          for="first-name-input"
          class="lcc-required-field">
          First name:
        </label>
        <ea-input
          formControlName="firstName"
          [errorMessages]="errorMessages"
          [id]="'first-name-input'"
          [maxLength]="30"
          [required]="true" />

        <label
          for="last-name-input"
          class="lcc-required-field">
          Last name:
        </label>
        <ea-input
          formControlName="lastName"
          [errorMessages]="errorMessages"
          [id]="'last-name-input'"
          [maxLength]="30"
          [required]="true" />

        <label
          for="city-input"
          class="lcc-required-field">
          City:
        </label>
        <ea-input
          formControlName="city"
          [errorMessages]="errorMessages"
          [id]="'city-input'"
          [maxLength]="30"
          [required]="true" />

        <label
          for="rating-input"
          class="lcc-required-field">
          LCC rating:
        </label>
        <ea-input
          formControlName="rating"
          [errorMessages]="errorMessages"
          [id]="'rating-input'"
          [maxLength]="6"
          [required]="true" />

        <label
          id="date-joined-label"
          for="date-joined-input"
          class="lcc-required-field">
          Date joined:
        </label>
        <ea-date-picker
          aria-labelledby="date-joined-label"
          formControlName="dateJoined"
          [id]="'date-joined-input'"
          [required]="true"
          [weekStartsOn]="weekStartsOn" />

        @if (!isSafeMode()) {
          <label for="email-input">Email:</label>
          <ea-input
            type="email"
            formControlName="email"
            [eaTooltip]="
              isEmailManagedByAccount
                ? 'This email address is managed by the member\'s account.'
                : ''
            "
            [errorMessages]="errorMessages"
            [id]="'email-input'"
            [maxLength]="50" />

          <label for="phone-number-input">Phone number:</label>
          <ea-input
            type="tel"
            formControlName="phoneNumber"
            [errorMessages]="phoneNumberErrorMessages"
            [id]="'phone-number-input'"
            [maxLength]="20" />

          <label for="year-of-birth-input">Year of birth:</label>
          <ea-input
            formControlName="yearOfBirth"
            [errorMessages]="errorMessages"
            [id]="'year-of-birth-input'"
            [maxLength]="4" />
        }

        <label for="chess-com-username-input">Chess.com username:</label>
        <ea-input
          formControlName="chessComUsername"
          [errorMessages]="chessComUsernameErrorMessages"
          [id]="'chess-com-username-input'"
          [maxLength]="25" />

        <label for="lichess-username-input">Lichess username:</label>
        <ea-input
          formControlName="lichessUsername"
          [errorMessages]="lichessUsernameErrorMessages"
          [id]="'lichess-username-input'"
          [maxLength]="20" />

        @if (originalMember()) {
          <label for="is-active-input">Active:</label>
          <ea-checkbox
            formControlName="isActive"
            [id]="'is-active-input'" />
        }
      </div>

      <aside class="lcc-required-fields-legend">Required fields</aside>

      @if (isSafeMode()) {
        <ea-alert
          class="safe-mode-notice"
          live="off"
          variant="info">
          Member's personal details have been hidden from view. You can disable Safe Mode
          from the User Settings menu.
        </ea-alert>
      }

      <ea-divider class="lcc-form-divider" />

      @if (originalMember()?.modificationInfo; as info) {
        <lcc-modification-info [info]="info" />
      }

      @if (originalMember()) {
        <ea-checkbox
          class="notify-member"
          size="sm"
          [eaTooltip]="
            notifyMember.disabled
              ? 'Add a valid email address and year of birth to email the member.'
              : ''
          "
          [formControl]="notifyMember"
          [label]="notifyMemberLabel" />
      }

      <lcc-form-actions
        entity="member"
        [hasUnsavedChanges]="hasUnsavedChanges()"
        [submitDisabled]="form.invalid || !hasUnsavedChanges()"
        [submitLabel]="originalMember() ? 'Update member' : 'Add member'"
        (cancel)="onCancel()"
        (restore)="onRestore()" />
    </form>
  </div>
</ea-card>
