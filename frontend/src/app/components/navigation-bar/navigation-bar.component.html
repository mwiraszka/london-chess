<div class="nav-left"></div>

<div class="content-container">
  <div class="nav-links">
    @for (link of links; track link.internalPath) {
      <a
        [attr.aria-label]="link.text"
        ariaCurrentWhenActive="page"
        class="nav-link"
        routerLinkActive="link-active"
        [routerLink]="link.internalPath | routerLink"
        [routerLinkActiveOptions]="{ exact: true }"
        [eaTooltip]="screenWidth() > 800 ? '' : link.text">
        <span class="link-text">{{ link.text }}</span>
        @if (link.icon) {
          <span class="link-icon">
            <ng-container *ngComponentOutlet="link.icon" />
          </span>
        }
      </a>
    }
  </div>

  <div class="nav-mid"></div>

  <div class="nav-controls">
    <button
      #menuTrigger
      aria-haspopup="dialog"
      aria-label="Menu"
      class="avatar-button"
      type="button"
      [attr.aria-controls]="menuId"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="isMenuOpen.set(!isMenuOpen())">
      @if (user()) {
        <ea-avatar
          size="sm"
          alt="Your avatar"
          [src]="avatarSrc()"
          [initials]="initials()" />
      } @else {
        <ea-icon-settings class="menu-icon" />
      }
    </button>
    <ea-popover
      aria-label="Menu"
      placement="bottom-end"
      [anchor]="menuTrigger"
      [closeOnEscape]="true"
      [closeOnOutsideClick]="true"
      [open]="isMenuOpen()"
      [surfaceId]="menuId"
      (closeRequested)="isMenuOpen.set(false)">
      @if (isMenuOpen()) {
        <lcc-user-settings-menu (close)="isMenuOpen.set(false)" />
      }
    </ea-popover>
  </div>
</div>

<div class="nav-right"></div>
