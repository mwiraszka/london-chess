@if (isLoading()) {
  <ul
    class="registrations"
    aria-busy="true">
    <li>
      <lcc-tournament-card [summary]="null" />
    </li>
  </ul>
} @else if (registrations().length) {
  <ul
    class="registrations"
    aria-label="Tournament registration">
    @for (summary of registrations(); track summary.number) {
      <li>
        <lcc-tournament-card [summary]="summary" />
      </li>
    }
  </ul>
}
