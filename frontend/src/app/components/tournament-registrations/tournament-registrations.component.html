<div class="stack">
  <!-- Holds the room of one tournament's card whatever the list turns out to hold -->
  <ul
    class="registrations"
    [attr.aria-busy]="isLoading() || null"
    [attr.aria-hidden]="!isLoading() || null"
    [class.registrations--reserve]="!isLoading()">
    <li>
      <lcc-tournament-card
        [detailsOnOneLine]="true"
        [summary]="null" />
    </li>
  </ul>

  @if (!isLoading()) {
    @if (registrations().length) {
      <ul
        class="registrations"
        aria-label="Tournament registration">
        @for (summary of registrations(); track summary.number) {
          <li>
            <lcc-tournament-card
              [detailsOnOneLine]="true"
              [summary]="summary" />
          </li>
        }
      </ul>
    } @else {
      <a
        eaButtonLink
        class="register-button"
        routerLink="/tournaments"
        size="lg"
        [uppercase]="true">
        Register for a tournament
      </a>
    }
  }
</div>
