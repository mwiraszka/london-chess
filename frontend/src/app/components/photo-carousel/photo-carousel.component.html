<div
  class="photo-container"
  role="region"
  aria-label="Photo carousel">
  @for (photo of photos(); track photo.id; let i = $index) {
    <button
      class="image-wrapper"
      type="button"
      [attr.aria-hidden]="i === currentIndex() ? null : true"
      [attr.aria-label]="'View next photo, currently showing ' + photo.caption"
      [class.active]="i === currentIndex()"
      [inert]="i !== currentIndex()"
      (click)="onNextPhoto()">
      <img
        class="carousel-photo"
        [alt]="photo.caption"
        [attr.height]="photo.mainHeight ?? null"
        [attr.width]="photo.mainWidth ?? null"
        [src]="photo.mainUrl" />
    </button>
  }
</div>

<div class="caption-container">
  @for (photo of photos(); track photo.id; let i = $index) {
    <p
      class="caption"
      [attr.aria-hidden]="i === currentIndex() ? null : true"
      [class.active]="i === currentIndex()">
      {{ photo.caption?.replace(': ', ': \n') }}
    </p>
  }
</div>

<div class="controls">
  <ea-button
    size="xs"
    variant="ghost"
    [aria-label]="isPaused() ? 'Play the slideshow' : 'Pause the slideshow'"
    [icon]="isPaused() ? playIcon : pauseIcon"
    (clicked)="isPaused.set(!isPaused())" />

  <div class="dots-container">
    @for (photo of photos(); track photo.id; let i = $index) {
      <button
        class="dot-button"
        type="button"
        [attr.aria-current]="i === currentIndex() || null"
        [attr.aria-label]="'View photo ' + (i + 1)"
        [class.active]="i === currentIndex()"
        (click)="onSelectPhoto(i)">
      </button>
    }
  </div>
</div>
