<div
  class="container"
  [style.background]="backgroundStyling()">
  <div class="banner-message-container">
    <div
      class="banner-message"
      #bannerMessage>
      <div
        class="marquee-content"
        #marqueeContent
        [class.animate]="shouldAnimate()"
        [style.animation-duration.s]="animationDuration()">
        <ng-container *ngTemplateOutlet="bannerContent; context: { isCopy: false }" />
        @if (shouldAnimate()) {
          <ng-container *ngTemplateOutlet="bannerContent; context: { isCopy: true }" />
        }
      </div>

      <!-- The copy only closes the loop of the scroll, so it is neither read out nor focusable -->
      <ng-template
        #bannerContent
        let-isCopy="isCopy">
        <span
          class="marquee-item"
          [attr.aria-hidden]="isCopy || null"
          [inert]="isCopy">
          <span>Next {{ nextEvents().length > 1 ? 'events' : 'event' }}:</span>
          @for (event of nextEvents(); track event.id) {
            @if (!$first) {
              <span class="event-divider"></span>
            }
            <span>
              @if (event.articleId) {
                <a
                  class="event-title-link lcc-link"
                  [routerLink]="['/article/view', event.articleId]">
                  <b>{{ event.title }}</b>
                </a>
              } @else {
                <b>{{ event.title }}</b>
              }
            </span>
          }
          <span>on</span>
          <span>
            <b>{{ nextEvents()[0].eventDate | formatDate }}</b>
          </span>
        </span>
      </ng-template>
    </div>

    <ea-button
      class="close-button"
      size="xs"
      variant="ghost"
      [aria-label]="'Close the upcoming events banner'"
      [icon]="closeIcon"
      (clicked)="clearBanner.emit()" />
  </div>
</div>
