<ea-card
  class="member-tournaments"
  [fullWidth]="true">
  <h3 slot="header">Tournaments</h3>

  @if (status() === 'failed') {
    <lcc-load-failed
      title="Unable to load tournaments"
      (retry)="onRetry()" />
  } @else {
    <lcc-data-table
      class="results"
      aria-label="Tournaments played"
      noDataText="No tournaments on record yet."
      [clickable]="true"
      [columns]="columns()"
      [data]="rows()"
      [loading]="loading()"
      [loadingRowCount]="loadingRowCount"
      [rowHref]="rowHref"
      [sizingRows]="sizingRows"
      (rowActivate)="onOpenTournament($event)">
      @if (resultCount() > pageSizes[0]) {
        <ea-paginator
          size="sm"
          [page]="page()"
          [pageSize]="pageSize()"
          [pageSizeOptions]="pageSizes"
          [showRangeLabel]="true"
          [totalItems]="resultCount()"
          (changed)="onPageChanged($event)" />
      }
    </lcc-data-table>
  }
</ea-card>

<ng-template
  #textCell
  let-row
  let-value="value">
  {{ value }}
</ng-template>

<ng-template
  #tournamentCell
  let-row>
  {{ row.tournament }}
  @if (row.section) {
    <span class="results__section">({{ row.section }})</span>
  }
</ng-template>

<ng-template
  #ratingCell
  let-row>
  @if (row.rating !== null) {
    {{ row.rating }}
    @if (row.provisionalGames) {
      <span
        class="results__secondary"
        [eaTooltip]="'Provisional, from ' + row.provisionalGames + ' games'">
        P{{ row.provisionalGames }}
      </span>
    }
  } @else {
    <span class="results__secondary">Unrated</span>
  }
</ng-template>
