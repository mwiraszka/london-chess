<div class="ring">
  <img
    class="ring__logo"
    src="assets/lcc-logo.svg"
    alt="London Chess Club"
    width="130"
    height="126" />

  @for (technology of technologies; track technology.name; let i = $index) {
    <span
      class="tech"
      [class.tech--active]="activeIndex() === i"
      [class.tech--neighbour]="isNeighbour(i)"
      [class.tech--outer-neighbour]="isOuterNeighbour(i)"
      (click)="onSelect(i)"
      (mouseenter)="activeIndex.set(i)"
      (mouseleave)="onLeave(i)">
      <img
        class="tech__icon"
        [src]="iconPath(technology)"
        [alt]="technology.name" />
    </span>
  }
</div>

<!-- Every entry stays laid out so the block keeps one height whatever is shown -->
<div class="tech-info">
  @for (technology of technologies; track technology.name; let i = $index) {
    <span
      class="tech-info__entry"
      [class.tech-info__entry--visible]="activeIndex() === i">
      <span class="tech-info__name">{{ technology.name }}</span>
      <span class="tech-info__purpose">{{ technology.purpose }}</span>
    </span>
  }
</div>
