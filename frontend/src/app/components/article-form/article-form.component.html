<ea-card [fullWidth]="true">
  <form
    class="lcc-editor-form"
    [formGroup]="form"
    (focusout)="onFieldLeft()"
    (ngSubmit)="onSubmit()">
    <ea-form-field
      label="Banner image"
      [errorMsg]="showBannerImageError ? 'Choose a banner image.' : undefined"
      [required]="true">
      <div class="banner">
        <div class="banner__frame">
          <lcc-image [image]="bannerImage()" />
        </div>

        <div class="banner__controls">
          <ea-button
            class="select-banner-image-button"
            eaTooltip="Choose a banner image"
            variant="secondary"
            [aria-label]="'Choose a banner image'"
            [icon]="selectBannerIcon"
            (clicked)="onSelectBannerImage()" />
          <ea-button
            class="revert-banner-image-button"
            variant="secondary"
            [aria-label]="'Put back the original banner image'"
            [disabled]="isBannerImageOriginal"
            [eaTooltip]="
              isBannerImageOriginal ? '' : 'Put back the original banner image'
            "
            [icon]="revertBannerIcon"
            (clicked)="onRevertBannerImage()" />
        </div>
      </div>
    </ea-form-field>

    <ea-input
      label="Title"
      formControlName="title"
      [errorMessages]="errorMessages"
      [maxLength]="120"
      [required]="true" />

    <div class="body-field">
      <ea-textarea
        label="Content"
        formControlName="body"
        [errorMessages]="errorMessages"
        [hint]="
          'Inserted images go where the cursor was last left, up to ' +
          maxBodyImages +
          ' in an article.'
        "
        [maxlength]="50000"
        [minHeight]="320"
        [required]="true" />
      <ea-button
        class="insert-image-button"
        size="sm"
        variant="secondary"
        [disabled]="!canInsertImage"
        [icon]="insertImageIcon"
        (clicked)="onInsertImage()">
        Insert image
      </ea-button>
    </div>

    @if (form.controls.body.value) {
      <ea-divider
        class="preview-divider"
        label="Preview" />
      <div class="body-preview">
        <lcc-markdown-renderer
          [data]="form.controls.body.value"
          [images]="bodyImages()" />
      </div>
    }

    @if (originalArticle()?.modificationInfo; as info) {
      <lcc-modification-info [info]="info" />
    }

    <div class="lcc-form-actions">
      <ea-button
        class="lcc-form-actions__restore restore-button"
        variant="ghost"
        [disabled]="!hasUnsavedChanges()"
        [icon]="restoreIcon"
        (clicked)="onRestore()">
        Discard changes
      </ea-button>
      <ea-button
        class="cancel-button"
        variant="secondary"
        (clicked)="onCancel()">
        Cancel
      </ea-button>
      <ea-button
        class="submit-button"
        type="submit"
        [disabled]="!hasUnsavedChanges()">
        {{ originalArticle() ? 'Update article' : 'Publish article' }}
      </ea-button>
    </div>
  </form>
</ea-card>
