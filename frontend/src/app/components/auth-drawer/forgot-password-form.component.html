@if (!codeSent()) {
  <form
    class="auth-form"
    (ngSubmit)="onSendCode()">
    <ea-input
      label="Email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
      [autofocus]="true"
      [errorMsg]="emailError()"
      (blurred)="onEmailBlur()"
      [value]="email()"
      (valueChange)="onEmailChange($event)" />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <ea-button
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [disabled]="!canSendCode()"
      [loading]="loading()">
      Send reset code
    </ea-button>
  </form>

  <p class="auth-link">
    <button
      type="button"
      class="auth-link__button lcc-link"
      (click)="authDrawer.setMode('login')">
      Back to log in
    </button>
  </p>
} @else {
  <form
    class="auth-form"
    (ngSubmit)="onResetPassword()">
    <p class="hint">
      If an account exists for {{ email() }}, a reset code is on its way. Enter it below
      with your new password.
    </p>

    <ea-code-input
      label="Reset code"
      [(value)]="code" />

    <div class="pw-field">
      <ea-input
        label="New password"
        type="password"
        autocomplete="new-password"
        [(value)]="newPassword" />
      @if (newPassword()) {
        <lcc-password-requirements [password]="newPassword()" />
      }
    </div>

    <ea-input
      label="Confirm password"
      type="password"
      autocomplete="new-password"
      [errorMsg]="confirmMismatch() ? 'Passwords do not match' : ''"
      [(value)]="confirmPassword" />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <ea-button
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [disabled]="!canReset()"
      [loading]="loading()">
      Reset password
    </ea-button>
  </form>

  <p class="auth-link">
    <button
      type="button"
      class="auth-link__button lcc-link"
      (click)="authDrawer.setMode('login')">
      Back to log in
    </button>
  </p>
}
