@if (codeSent()) {
  <form
    class="auth-form"
    [formGroup]="resetForm"
    (ngSubmit)="onResetPassword()">
    <p class="hint">
      If an account exists for {{ emailForm.controls.email.value }}, a reset code is on
      its way. Enter it below with your new password.
    </p>

    <ea-code-input
      label="Reset code"
      formControlName="code" />

    <lcc-new-password-fields [group]="resetForm.controls.passwords" />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <ea-button
      type="submit"
      size="sm"
      variant="primary"
      [fullWidth]="true"
      [disabled]="resetForm.invalid"
      [loading]="loading()">
      Reset password
    </ea-button>
  </form>
} @else {
  <form
    class="auth-form"
    [formGroup]="emailForm"
    (ngSubmit)="onSendCode()">
    <ea-input
      label="Email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
      formControlName="email"
      [autofocus]="true" />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <ea-button
      type="submit"
      size="sm"
      variant="primary"
      [fullWidth]="true"
      [disabled]="emailForm.invalid"
      [loading]="loading()">
      Send reset code
    </ea-button>
  </form>
}

<p class="auth-link">
  <button
    type="button"
    class="auth-link__button lcc-link"
    keepFocus
    (click)="authDrawer.setMode('login')">
    Back to log in
  </button>
</p>
