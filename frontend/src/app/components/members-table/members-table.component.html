@if (empty()) {
  <ea-empty-state
    class="members__empty"
    description="No members match these filters."
    [icon]="emptyIcon" />
} @else {
  <lcc-data-table
    class="members"
    aria-label="Members"
    [clickable]="!showsDetails()"
    [columns]="columns()"
    [rowControls]="showsDetails() ? rowControls : undefined"
    [data]="rows()"
    [fullWidth]="true"
    [loading]="isLoading()"
    [loadingRowCount]="loadingRowCount()"
    [rowHref]="rowHref()"
    [sizingRows]="sizingRows()"
    [sort]="sortState()"
    (rowActivate)="onOpenProfile($event)"
    (sorted)="onSorted($event)">
    <ea-paginator
      align="center"
      size="sm"
      [page]="options().page"
      [pageSize]="options().pageSize"
      [pageSizeOptions]="pageSizes"
      [showAllOption]="true"
      [showRangeLabel]="filteredCount() !== null"
      [totalItems]="filteredCount() ?? 0"
      (changed)="onPageChanged($event)" />
  </lcc-data-table>
}

@if (isAdmin() && isSafeMode()) {
  <lcc-safe-mode-notice class="members__safe-mode" />
}

<ng-template
  #nameCell
  let-row>
  <span
    class="members__name"
    [class.members__name--inactive]="!row.member.isActive"
    [eaTooltip]="row.member.isActive ? '' : 'Inactive member'">
    <ng-container
      *ngTemplateOutlet="
        memberName;
        context: { $implicit: row, text: row.firstName + ' ' + row.lastName }
      " />
    @if (isCityChampion(row.member)) {
      <a
        aria-label="2025 City Champion"
        class="members__champion-link"
        routerLink="/city-championship"
        eaTooltip="2025 City Champion">
        <ea-icon-trophy class="members__champion-icon" />
      </a>
    }
  </span>
</ng-template>

<ng-template
  #firstNameCell
  let-row>
  <span
    class="members__name"
    [class.members__name--inactive]="!row.member.isActive"
    [eaTooltip]="row.member.isActive ? '' : 'Inactive member'">
    <ng-container
      *ngTemplateOutlet="memberName; context: { $implicit: row, text: row.firstName }" />
  </span>
</ng-template>

<ng-template
  #lastNameCell
  let-row>
  <span
    class="members__name"
    [class.members__name--inactive]="!row.member.isActive"
    [eaTooltip]="row.member.isActive ? '' : 'Inactive member'">
    <ng-container
      *ngTemplateOutlet="memberName; context: { $implicit: row, text: row.lastName }" />
    @if (isCityChampion(row.member)) {
      <a
        aria-label="2025 City Champion"
        class="members__champion-link"
        routerLink="/city-championship"
        eaTooltip="2025 City Champion">
        <ea-icon-trophy class="members__champion-icon" />
      </a>
    }
  </span>
</ng-template>

<ng-template
  #memberName
  let-row
  let-text="text">
  @if (row.member.number !== null) {
    <a
      class="members__profile-link"
      [routerLink]="['/members', row.member.number]"
      [innerHTML]="text | highlight: options().search">
    </a>
  } @else {
    <span [innerHTML]="text | highlight: options().search"></span>
  }
</ng-template>

<ng-template
  #ratingCell
  let-row>
  {{ row.member.rating }}
</ng-template>

<ng-template
  #peakRatingCell
  let-row>
  {{ row.member.peakRating }}
</ng-template>

<ng-template
  #highlightCell
  let-value="value">
  <span [innerHTML]="value | highlight: options().search"></span>
</ng-template>

<ng-template
  #dateCell
  let-value="value">
  {{ value | formatDate: 'short no-time' }}
</ng-template>
