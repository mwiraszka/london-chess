<div class="banner-image-container">
  <lcc-image [image]="bannerImage" />
  <h3 class="title lcc-truncate-max-2-lines">
    {{ article.title | truncateByChars: 120 }}
  </h3>
</div>

<div class="modification-info-container">
  <div class="author-container">
    <div class="author-row">
      <span class="author-name">
        <lcc-member-link
          [memberNumber]="article.modificationInfo.createdByNumber"
          [name]="article.modificationInfo.createdBy"
          [showAvatar]="true" />
      </span>
    </div>
    <span class="date-created">
      {{ article.modificationInfo.dateCreated | formatDate: 'short' }}
    </span>
  </div>

  <div class="editor-container">
    @if (article.modificationInfo | wasEdited) {
      <span class="updated">last updated</span>
      <div class="modification-details">
        <span class="editor-name">
          <lcc-member-link
            [memberNumber]="article.modificationInfo.lastEditedByNumber"
            [name]="article.modificationInfo.lastEditedBy"
            [showAvatar]="true" />
        </span>
        <span class="vertical-spacer">|</span>
        <span class="date-last-edited">
          {{ article.modificationInfo.dateLastEdited | formatDate: 'short' }}
        </span>
      </div>
    }
  </div>
</div>

<hr />

<div class="markdown-container">
  <lcc-markdown-renderer
    [data]="article.body"
    [images]="bodyImages">
  </lcc-markdown-renderer>
</div>
