<ea-dialog
  width="2xl"
  (keydown)="onKeydown($event)"
  (keyup)="onKeyup($event)">
  <h3
    slot="header"
    class="lcc-truncate">
    {{ album() }}
  </h3>

  @if (shownImage(); as image) {
    <figure
      #figure
      tabindex="-1"
      autofocus
      [adminControls]="isAdmin() ? getAdminControlsConfig(image) : null">
      <div class="image-container">
        <button
          type="button"
          class="enlarge-button"
          aria-label="Enlarge image"
          (click)="onEnlarge()">
          <lcc-image
            [image]="image"
            (loaded)="onImageLoaded(image)" />
        </button>

        <ea-button
          class="previous-image-button"
          aria-label="Previous image"
          eaTooltip="Previous image"
          variant="secondary"
          [class.active]="isPreviousImageButtonActive()"
          [disabled]="images().length === 1"
          [icon]="previousIcon"
          (clicked)="onPreviousImage()" />

        <ea-button
          class="next-image-button"
          aria-label="Next image"
          eaTooltip="Next image"
          variant="secondary"
          [class.active]="isNextImageButtonActive()"
          [disabled]="images().length === 1"
          [icon]="nextIcon"
          (clicked)="onNextImage()" />
      </div>

      <figcaption class="image-caption lcc-truncate">{{ displayedCaption() }}</figcaption>
    </figure>

    <!-- Outside the figure, so a right click brings up the browser's own menu -->
    <dialog
      #enlarged
      class="enlarged-image"
      [attr.aria-label]="image.caption || 'Enlarged image'"
      (click)="onShrink()"
      (close)="onEnlargedClosed()"
      (keydown)="$event.stopPropagation()">
      @if (isEnlarged()) {
        <lcc-image [image]="image" />
      }
    </dialog>
  }
</ea-dialog>
