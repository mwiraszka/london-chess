<ea-card [fullWidth]="true">
  <form
    class="lcc-editor-form"
    [formGroup]="form"
    (focusout)="onFieldLeft()"
    (ngSubmit)="onSubmit()">
    <div class="image-frame">
      @if (imageEntity(); as imageEntity) {
        <lcc-image [image]="imageEntity.image" />
      } @else {
        <img
          alt="Image preview"
          [src]="newImageDataUrl() ?? fallbackSrc" />
      }
    </div>

    @if (!imageEntity()) {
      <ea-file-uploader
        accept="image/*"
        label="Image file"
        [errorMsg]="showFileError ? 'Choose an image to upload.' : undefined"
        [formControl]="fileChoice"
        [multiple]="false"
        [required]="true"
        [showFileList]="false"
        (rejected)="onRejectFiles()" />
    }

    <ea-input
      label="Caption"
      formControlName="caption"
      [errorMessages]="errorMessages"
      [maxLength]="120"
      [required]="true" />

    <ea-autocomplete
      hint="Pick an existing album, or type a new name to start one."
      label="Album"
      formControlName="album"
      [errorMessages]="errorMessages"
      [maxLength]="120"
      [options]="albumOptions()"
      [required]="true" />

    @if (imageEntity(); as imageEntity) {
      <lcc-modification-info [info]="imageEntity.image.modificationInfo" />
    }

    <div class="lcc-form-actions">
      <ea-button
        class="lcc-form-actions__restore restore-button"
        variant="ghost"
        [disabled]="!hasUnsavedChanges()"
        [icon]="restoreIcon"
        (clicked)="onRestore()">
        Discard changes
      </ea-button>
      <ea-button
        class="cancel-button"
        variant="secondary"
        (clicked)="onCancel()">
        Cancel
      </ea-button>
      <ea-button
        class="submit-button"
        type="submit"
        [disabled]="!hasUnsavedChanges()">
        {{ imageEntity() ? 'Update image' : 'Add image' }}
      </ea-button>
    </div>
  </form>
</ea-card>
