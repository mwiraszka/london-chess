<ea-card [fullWidth]="true">
  <div class="lcc-form-card">
    <form
      class="lcc-form"
      [formGroup]="form"
      (focusout)="onFieldLeft()"
      (ngSubmit)="onSubmit()">
      <div class="lcc-form-fields">
        @if (imageEntity(); as imageEntity) {
          <div class="image-container full-span">
            <lcc-image [image]="imageEntity.image" />
          </div>
        } @else {
          <label
            for="file-input"
            class="lcc-required-field">
            File:
          </label>
          <ea-form-field
            [errorMsg]="showFileError ? 'Choose an image to upload' : undefined">
            <div class="file-and-preview-container">
              <div class="image-container">
                <img
                  alt="Image preview"
                  [src]="newImageDataUrl() ?? fallbackSrc" />
              </div>
              <ea-file-uploader
                class="choose-file-button"
                accept="image/*"
                aria-label="Choose file"
                buttonLabel=""
                eaTooltip="Choose file"
                size="sm"
                variant="button"
                [buttonIcon]="imagePlusIcon"
                [formControl]="fileChoice"
                [id]="'file-input'"
                [multiple]="false"
                [showConstraints]="false"
                [showFileList]="false"
                (rejected)="onRejectFiles()" />
            </div>
          </ea-form-field>
        }

        <label
          for="caption-input"
          class="lcc-required-field">
          Caption:
        </label>
        <ea-input
          formControlName="caption"
          [errorMessages]="errorMessages"
          [id]="'caption-input'"
          [maxLength]="120"
          [required]="true" />

        <label
          id="album-label"
          class="lcc-required-field">
          Album:
        </label>
        <ea-radio-group
          class="lcc-form-radio-box"
          aria-labelledby="album-label"
          formControlName="album"
          [errorMessages]="errorMessages"
          [required]="true"
          (changed)="onAlbumRadioChange($event)">
          <div class="albums-grid">
            @for (album of existingAlbums(); track album) {
              <ea-radio
                [label]="album"
                [value]="album" />
            }
            <div class="new-album">
              <label
                class="new-album-label"
                for="new-album-radio">
                New album
              </label>
              <ea-radio
                [id]="'new-album-radio'"
                [value]="albumExists ? '' : form.controls.album.value" />
              <ea-input
                class="new-album-input"
                aria-label="New album name"
                placeholder="New album"
                [formControl]="newAlbumName"
                [maxLength]="120"
                (focusin)="onNewAlbumInputFocus()" />
            </div>
          </div>
        </ea-radio-group>
      </div>

      <aside class="lcc-required-fields-legend">Required fields</aside>

      <ea-divider class="lcc-form-divider" />

      @if (imageEntity(); as imageEntity) {
        <lcc-modification-info [info]="imageEntity.image.modificationInfo" />
      }

      <lcc-form-actions
        entity="image"
        [hasUnsavedChanges]="hasUnsavedChanges()"
        [submitDisabled]="form.invalid || !hasUnsavedChanges()"
        [submitLabel]="imageEntity() ? 'Update image' : 'Add image'"
        (cancel)="onCancel()"
        (restore)="onRestore()" />
    </form>
  </div>
</ea-card>
