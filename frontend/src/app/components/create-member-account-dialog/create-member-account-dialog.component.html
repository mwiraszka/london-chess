<ea-dialog
  width="md"
  [(open)]="open">
  <span slot="header">{{ isResend() ? 'Resend invitation' : 'Create account' }}</span>

  <div class="account-form">
    <p class="hint">
      These details are saved to {{ member().firstName }}'s member record, and an
      invitation to create an account is emailed to the address below.
    </p>

    <lcc-member-account-fields
      [group]="form"
      [yearOfBirthRequired]="false" />
  </div>

  <div slot="footer">
    <ea-button
      size="sm"
      variant="secondary"
      (clicked)="open.set(false)">
      Cancel
    </ea-button>
    <ea-button
      size="sm"
      variant="primary"
      [disabled]="form.invalid"
      [loading]="sending()"
      (clicked)="onSubmit()">
      {{ isResend() ? 'Resend invitation' : 'Send invitation' }}
    </ea-button>
  </div>
</ea-dialog>
