<ea-card [fullWidth]="true">
  <div class="lcc-form-card">
    <form
      class="lcc-form"
      [formGroup]="form"
      (focusout)="onFieldLeft()"
      (ngSubmit)="onSubmit()">
      <div class="lcc-form-fields">
        <label
          id="event-date-label"
          for="event-date-input"
          class="lcc-required-field">
          Event date:
        </label>
        <ea-date-picker
          aria-labelledby="event-date-label"
          formControlName="eventDay"
          [id]="'event-date-input'"
          [required]="true"
          [weekStartsOn]="weekStartsOn" />

        <label
          for="event-time-input"
          class="lcc-required-field">
          Event time:
        </label>
        <ea-time-picker
          format="12h"
          formControlName="eventTime"
          [id]="'event-time-input'"
          [minuteStep]="5"
          [required]="true" />

        <label
          for="title-input"
          class="lcc-required-field">
          Title:
        </label>
        <ea-input
          formControlName="title"
          [errorMessages]="errorMessages"
          [id]="'title-input'"
          [maxLength]="100"
          [required]="true" />

        <label
          for="details-input"
          class="lcc-required-field">
          Details:
        </label>
        <ea-textarea
          formControlName="details"
          [errorMessages]="errorMessages"
          [id]="'details-input'"
          [maxlength]="200"
          [minHeight]="100"
          [required]="true" />

        <label
          id="event-type-label"
          class="lcc-required-field">
          Event type:
        </label>
        <ea-radio-group
          class="lcc-form-radio-box"
          aria-labelledby="event-type-label"
          formControlName="type"
          [required]="true">
          @for (option of eventTypeOptions; track option.value) {
            <ea-radio
              [label]="option.label"
              [value]="option.value" />
          }
        </ea-radio-group>

        <label for="article-id-input">Associated Article ID:</label>
        <ea-input
          formControlName="articleId"
          [errorMessages]="errorMessages"
          [id]="'article-id-input'"
          [maxLength]="24" />
      </div>

      <aside class="lcc-required-fields-legend">Required fields</aside>

      <ea-divider class="lcc-form-divider" />

      @if (originalEvent()?.modificationInfo; as info) {
        <lcc-modification-info [info]="info" />
      }

      <lcc-form-actions
        entity="event"
        [hasUnsavedChanges]="hasUnsavedChanges()"
        [submitDisabled]="form.invalid || !hasUnsavedChanges()"
        [submitLabel]="originalEvent() ? 'Update event' : 'Add event'"
        (cancel)="onCancel()"
        (restore)="onRestore()" />
    </form>
  </div>
</ea-card>
