<ea-card [fullWidth]="true">
  <form
    class="lcc-editor-form"
    [formGroup]="form"
    (focusout)="onFieldLeft()"
    (ngSubmit)="onSubmit()">
    <div class="lcc-form-row">
      <ea-date-picker
        label="Date"
        formControlName="eventDay"
        [required]="true"
        [weekStartsOn]="weekStartsOn" />
      <ea-time-picker
        format="12h"
        label="Start time"
        formControlName="eventTime"
        [minuteStep]="5"
        [required]="true" />
    </div>

    <ea-input
      label="Title"
      formControlName="title"
      [errorMessages]="errorMessages"
      [maxLength]="100"
      [required]="true" />

    <ea-textarea
      label="Details"
      formControlName="details"
      [errorMessages]="errorMessages"
      [maxlength]="200"
      [required]="true" />

    <ea-dropdown
      label="Event type"
      formControlName="type"
      [options]="eventTypeOptions"
      [required]="true" />

    <ea-input
      hint="Links the event to the article with its full details."
      label="Article ID"
      formControlName="articleId"
      [errorMessages]="errorMessages"
      [maxLength]="24" />

    @if (originalEvent()?.modificationInfo; as info) {
      <lcc-modification-info [info]="info" />
    }

    <div class="lcc-form-actions">
      <ea-button
        class="lcc-form-actions__restore restore-button"
        variant="ghost"
        [disabled]="!hasUnsavedChanges()"
        [icon]="restoreIcon"
        (clicked)="onRestore()">
        Discard changes
      </ea-button>
      <ea-button
        class="cancel-button"
        variant="secondary"
        (clicked)="onCancel()">
        Cancel
      </ea-button>
      <ea-button
        class="submit-button"
        type="submit"
        [disabled]="!hasUnsavedChanges()">
        {{ originalEvent() ? 'Update event' : 'Add event' }}
      </ea-button>
    </div>
  </form>
</ea-card>
