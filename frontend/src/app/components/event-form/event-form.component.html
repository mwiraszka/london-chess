<ea-card [fullWidth]="true">
  <div class="form-card">
    <form
      class="lcc-form"
      [formGroup]="form"
      (focusout)="onFieldLeft()"
      (ngSubmit)="onSubmit()">
      <div class="lcc-form-fields">
        <label
          for="event-date-input"
          class="lcc-required-field">
          Event date:
        </label>
        <ea-date-picker
          formControlName="eventDay"
          [id]="'event-date-input'"
          [required]="true"
          [weekStartsOn]="weekStartsOn" />

        <label
          for="event-time-input"
          class="lcc-required-field">
          Event time:
        </label>
        <ea-time-picker
          format="12h"
          formControlName="eventTime"
          [id]="'event-time-input'"
          [minuteStep]="5"
          [required]="true" />

        <label
          for="title-input"
          class="lcc-required-field">
          Title:
        </label>
        <ea-input
          formControlName="title"
          [errorMessages]="errorMessages"
          [id]="'title-input'"
          [maxLength]="100"
          [required]="true" />

        <label
          for="details-input"
          class="lcc-required-field">
          Details:
        </label>
        <ea-textarea
          formControlName="details"
          [errorMessages]="errorMessages"
          [id]="'details-input'"
          [maxlength]="200"
          [minHeight]="100"
          [required]="true" />

        <label class="lcc-required-field">Event type:</label>
        <ea-radio-group
          class="event-type-group"
          aria-label="Event type"
          formControlName="type"
          [required]="true">
          @for (option of eventTypeOptions; track option.value) {
            <ea-radio
              [label]="option.label"
              [value]="option.value" />
          }
        </ea-radio-group>

        <label for="article-id-input">Associated Article ID:</label>
        <ea-input
          formControlName="articleId"
          [errorMessages]="errorMessages"
          [id]="'article-id-input'"
          [maxLength]="24" />
      </div>

      <aside class="lcc-required-fields-legend">Required fields</aside>

      <ea-divider class="form-divider" />

      @if (originalEvent()?.modificationInfo; as info) {
        <lcc-modification-info [info]="info" />
      }

      <div class="lcc-form-actions">
        <ea-button
          class="lcc-form-actions__restore restore-button"
          size="sm"
          variant="ghost"
          [disabled]="!hasUnsavedChanges()"
          [icon]="restoreIcon"
          (clicked)="onRestore()">
          Revert
        </ea-button>
        <div class="lcc-form-actions__primary">
          <ea-button
            class="cancel-button"
            size="sm"
            variant="secondary"
            [fullWidth]="true"
            [uppercase]="true"
            (clicked)="onCancel()">
            Cancel
          </ea-button>
          <ea-button
            class="submit-button"
            size="sm"
            type="submit"
            [disabled]="form.invalid || !hasUnsavedChanges()"
            [fullWidth]="true"
            [uppercase]="true">
            {{ originalEvent() ? 'Update event' : 'Add event' }}
          </ea-button>
        </div>
      </div>
    </form>
  </div>
</ea-card>
