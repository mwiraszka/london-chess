name: Frontend Production Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-production.yaml

jobs:
  Deploy-Production:
    # Set the repository variable ENABLE_VERCEL to 'true' once the Vercel project
    # and secrets are configured (see docs/deployment.md).
    if: ${{ vars.ENABLE_VERCEL == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Vercel CLI
        run: pnpm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts
        run: >
          vercel deploy --prebuilt --prod --yes
          --token=${{ secrets.VERCEL_TOKEN }}
          --meta githubCommitSha=${{ github.sha }}
          --meta githubCommitRef=${{ github.ref_name }}

  Create-Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract Version from Changelog
        id: version
        run: |
          version=$(grep -m1 -oP '## \[v\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if Release Exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Release Notes
        if: steps.check_release.outputs.exists == 'false'
        run: |
          awk '/^## \[/{if(n++)exit}n' CHANGELOG.md | tail -n +2 > release_notes.md

      - name: Create Tag
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git tag ${{ steps.version.outputs.tag }} ${{ github.sha }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md
