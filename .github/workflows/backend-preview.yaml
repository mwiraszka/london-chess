name: Backend Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}

on:
  push:
    branches-ignore:
      - main
    paths:
      - backend/**
      - .github/workflows/backend-preview.yaml

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        run: pnpm install --global vercel

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The function ships as this one file, which starts far faster than loading each module
      - name: Bundle Function
        run: pnpm bundle

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --meta githubCommitSha=${{ github.sha }} \
            --meta githubCommitRef=${{ github.ref_name }})
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Alias to Preview Domain
        run: >
          vercel alias set ${{ steps.deploy.outputs.url }} api-preview.londonchess.ca
          --token=${{ secrets.VERCEL_TOKEN }} --scope=eagami
