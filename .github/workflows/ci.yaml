name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  Frontend-Checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check Formatting
        run: pnpm format:check

      # The thresholds in angular.json fail this step below 90% coverage
      - name: Test With Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build:prod

  Backend-Checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The backend lockfile is untracked, so dependencies resolve from package.json
      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # The in-memory database the tests run against downloads its binary on first use
      - name: Cache MongoDB Binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package.json') }}

      # The thresholds in vitest.config.ts fail this step below 90% coverage
      - name: Test With Coverage
        run: pnpm test:coverage
